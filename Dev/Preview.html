<!DOCTYPE html>
<!-- FranticDreamer 2026 -->
<!-- Browser preview of UI/Index.html with a mocked client and server. Not shipped to players. -->
<!-- The real page's markup, stylesheets and scripts are loaded from UI/Index.html, so this file never needs updating alongside it. -->
<html lang="en-GB">
<head>
	<meta charset="utf-8">
	<title>Frantic's Wizarding Communication (Preview)</title>
	<style>
		.dev-controls
		{
			position: fixed;
			left: 16px;
			top: 16px;
			z-index: 99;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}

		/* In game the view is only as big as the phone; here the whole window stands in, so place the docked phone like the real view would be. */
		body.is-docked-preview .phone
		{
			left: var(--preview-x);
			top: var(--preview-y);
			translate: -50% -50%;
		}

		body.is-docked-preview .toast
		{
			left: var(--preview-x);
			right: auto;
			top: var(--preview-y);
			translate: calc(var(--phone-width) / 2 - 100%) calc(var(--phone-height) / -2);
		}
	</style>
</head>
<body style="background: #020">
	<div class="dev-controls">
		<button onclick="OwlsDev.Open()">Open phone</button>
		<button onclick="OwlsDev.Close()">Close phone</button>
		<button onclick="OwlsDev.Incoming(3)">Incoming group owl</button>
		<button onclick="OwlsDev.Incoming(1)">Incoming direct owl</button>
		<button onclick="OwlsDev.Inform()">Receive inform request</button>
		<button onclick="OwlsDev.Inform('Ominis Gaunt')">Another inform request</button>
		<button onclick="OwlsDev.InformWithoutConsent()">Receive inform (no consent)</button>
		<button onclick="OwlsDev.ResetPosition()">/owl_resetpos</button>
		<button onclick="OwlsDev.MemberLeaves(3)">Someone leaves group</button>
		<button onclick="OwlsDev.Typing(1)">Natsai types</button>
		<button onclick="OwlsDev.Typing(3)">Group members type</button>
		<button onclick="OwlsDev.RemovedFromGroup(3)">Removed from group</button>
		<button onclick="OwlsDev.Announce()">Ministry announcement</button>
		<button onclick="OwlsDev.DuelStarts()">Duel starts (quiet)</button>
		<button onclick="OwlsDev.DuelEnds()">Duel ends</button>
		<button onclick="OwlsDev.CharacterDeleted()">Everett's character deleted</button>
		<button onclick="OwlsDev.IncomingCall()">Incoming call (Sebastian)</button>
		<button onclick="OwlsDev.OtherHangsUp()">Other side hangs up</button>
		<button onclick="OwlsDev.MissedWhileBusy()">Missed call while busy</button>
		<button onclick="OwlsDev.OtherMutes(true)">Other side mutes</button>
		<button onclick="OwlsDev.OtherMutes(false)">Other side unmutes</button>
		<button onclick="OwlsDevBackground.Pick()">Background image…</button>
		<button onclick="OwlsDevBackground.Reset()">Default background</button>
	</div>
	<div id="page"></div>

	<script src="DevBackground.js"></script>
	<script src="DevMock.js"></script>
	<script>
		(async () =>
		{
			const base = new URL("../UI/", location.href);
			const html = await (await fetch(new URL("Index.html", base))).text();
			const page = new DOMParser().parseFromString(html, "text/html");

			for (const sheet of page.querySelectorAll("link[rel=stylesheet]"))
			{
				const link = document.createElement("link");
				link.rel = "stylesheet";
				link.href = new URL(sheet.getAttribute("href"), base).href;

				if (sheet.integrity)
				{
					link.integrity = sheet.integrity;
					link.crossOrigin = "anonymous";
				}

				document.head.prepend(link);
			}

			const scripts = [...page.querySelectorAll("script[src]")].map((script) => new URL(script.getAttribute("src"), base).href);
			page.querySelectorAll("script").forEach((script) => script.remove());

			// The page's own markup, from this repository; it holds no player data.
			document.getElementById("page").replaceWith(...page.body.childNodes);

			for (const source of scripts)
			{
				await new Promise((resolve, reject) =>
				{
					const script = document.createElement("script");
					script.src = source;
					script.onload = resolve;
					script.onerror = reject;
					document.body.appendChild(script);
				});
			}
		})();
	</script>
</body>
</html>
